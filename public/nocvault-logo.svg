<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215 46" role="img" aria-label="NocVault">
  <!-- Mark: a folded-ribbon N whose diagonal carries two network nodes.
       Flat fills, no gradient: the shell is dark in both themes, so a fade
       would be half-invisible exactly where the mark is used most. -->
  <g fill="#C8102E">
    <rect x="4" y="9" width="6.5" height="28" rx="3.25"/>
    <rect x="27.5" y="9" width="6.5" height="28" rx="3.25"/>
    <path d="M7.2 9 L13.2 9 L34 37 L28 37 Z"/>
    <circle cx="30.7" cy="7.5" r="5.6"/>
    <circle cx="7.2" cy="38.5" r="5.6"/>
  </g>
  <circle cx="30.7" cy="7.5" r="2.1" fill="#ffffff" opacity="0.55"/>
  <circle cx="7.2" cy="38.5" r="2.1" fill="#ffffff" opacity="0.55"/>
  <text x="48" y="30" font-size="26" font-weight="700" letter-spacing="-0.3" font-family="'Rubik','Helvetica Neue',Helvetica,Arial,sans-serif"><tspan fill="#ffffff">Noc</tspan><tspan fill="#C8102E">Vault</tspan></text>
</svg>
